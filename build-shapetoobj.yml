name: Build ShapeToObj

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Open Rails fork containing ShapeToObj
        uses: actions/checkout@v4
        with:
          repository: Hirek193/openrails
          ref: master
          fetch-depth: 1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Source/ORTS.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ShapeToObj
        run: msbuild Source/ShapeToObj/ShapeToObj.csproj /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU"

      - name: Locate and package EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path . -Filter ShapeToObj.exe -Recurse |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "ShapeToObj.exe was not produced." }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $exe.FullName artifact/ShapeToObj.exe
          Get-ChildItem artifact

      - name: Upload ShapeToObj.exe
        uses: actions/upload-artifact@v4
        with:
          name: ShapeToObj-Windows
          path: artifact/ShapeToObj.exe
